<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小鱼摄影 · 客片画廊</title>
<style>
  :root{
    --bg:#0f1115; --card:#181b22; --line:#262b34; --text:#eef1f6; --muted:#9aa3b2;
    --accent:#ff5a5f; --accent2:#ffb86b; --ok:#37d67a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
  header{padding:28px 20px 14px;text-align:center;
    background:linear-gradient(160deg,#1a1d24,#0f1115);border-bottom:1px solid var(--line);}
  header h1{margin:0;font-size:22px;letter-spacing:2px}
  header p{margin:6px 0 0;color:var(--muted);font-size:13px}
  .wrap{max-width:880px;margin:0 auto;padding:18px 14px 60px}
  .section-title{display:flex;align-items:center;gap:8px;margin:26px 4px 14px;font-size:16px;font-weight:600}
  .section-title::before{content:"";width:4px;height:16px;background:var(--accent);border-radius:2px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(min-width:680px){.grid{grid-template-columns:repeat(3,1fr)}}
  .ph{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .ph img{width:100%;height:160px;object-fit:cover;display:block;background:#222}
  .ph .cap{padding:8px 10px;font-size:12px;color:var(--muted);min-height:30px}
  .empty{color:var(--muted);text-align:center;padding:40px 0;font-size:14px}
  .form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .field input,.field select,.field textarea{
    width:100%;background:#0f1115;border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:12px;font-size:15px;outline:none}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
  .field textarea{resize:vertical;min-height:74px}
  .btn{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#1a0e0e;border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:700;
    cursor:pointer;margin-top:6px}
  .btn:disabled{opacity:.6}
  .msg{margin-top:12px;text-align:center;font-size:14px;min-height:20px}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--accent)}
  .tip{color:var(--muted);font-size:12px;margin-top:8px;line-height:1.6}
  .loading{text-align:center;color:var(--muted);padding:30px}
  footer{text-align:center;color:#5b6472;font-size:12px;padding:24px}
</style>
</head>
<body>
<header>
  <h1>小鱼摄影</h1>
  <p>客片画廊 · 预约跟拍</p>
</header>
<div class="wrap">
  <div class="section-title">客片画廊</div>
  <div id="gallery"><div class="loading">加载中…</div></div>

  <div class="section-title">预约跟拍</div>
  <div class="form">
    <div class="field"><label>您的称呼 *</label><input id="f-name" placeholder="如：王女士"></div>
    <div class="field"><label>联系电话 *</label><input id="f-phone" type="tel" placeholder="方便摄影师联系您"></div>
    <div class="field"><label>期望拍摄日期</label><input id="f-date" type="date"></div>
    <div class="field"><label>跟拍类型</label>
      <select id="f-service">
        <option value="婚礼跟拍">婚礼跟拍</option>
        <option value="活动跟拍">活动跟拍</option>
        <option value="个人写真">个人写真</option>
        <option value="产品/商业">产品/商业</option>
        <option value="其他">其他</option>
      </select>
    </div>
    <div class="field"><label>预算范围</label><input id="f-budget" placeholder="如：3000-5000"></div>
    <div class="field"><label>备注</label><textarea id="f-note" placeholder="拍摄地点、风格偏好等"></textarea></div>
    <button class="btn" id="submitBtn">提交预约</button>
    <div class="msg" id="msg"></div>
    <div class="tip">提交后摄影师会尽快与您联系。本页仅用于查看客片与预约，不涉及您的任何隐私数据。</div>
  </div>
  <footer>© 小鱼摄影 · 由小鱼工作台提供技术支持</footer>
</div>

<script>
// ===== 配置区（部署后按需要修改）=====
// 预约提交端点：部署 submitBooking 云函数后，把微信云开发「HTTP 触发」的访问地址填到这里。
// 也可通过网址参数覆盖：client.html?ep=https://xxxx
var BOOKING_ENDPOINT = "";
// 客片清单与图片所在目录（相对本页，部署在 GitHub Pages 的 kepian/ 下）
var MANIFEST = "./kepian/manifest.json";
var IMG_BASE = "./kepian/";
// ====================================

(function(){
  var params = new URLSearchParams(location.search);
  var ep = params.get("ep");
  if(ep) BOOKING_ENDPOINT = ep;

  // 1) 加载客片
  fetch(MANIFEST + "?t=" + Date.now()).then(function(r){return r.json();}).then(function(list){
    var items = (list||[]).filter(function(x){return x && x.isKepian !== false;});
    var box = document.getElementById("gallery");
    if(!items.length){ box.innerHTML = '<div class="empty">客片即将上线，敬请期待～</div>'; return; }
    box.className = "grid";
    items.forEach(function(it){
      var div = document.createElement("div"); div.className = "ph";
      var img = document.createElement("img");
      img.loading = "lazy";
      img.src = IMG_BASE + it.file;
      img.alt = it.caption || "";
      img.onerror = function(){ this.src = "https://raw.githubusercontent.com/xiaoyusansui/workbench/main/kepian/" + it.file; };
      var cap = document.createElement("div"); cap.className = "cap"; cap.textContent = it.caption || "";
      div.appendChild(img); div.appendChild(cap); box.appendChild(div);
    });
  }).catch(function(e){
    document.getElementById("gallery").innerHTML = '<div class="empty">客片加载失败，请稍后刷新</div>';
  });

  // 2) 预约提交
  var btn = document.getElementById("submitBtn");
  btn.addEventListener("click", function(){
    var name = document.getElementById("f-name").value.trim();
    var phone = document.getElementById("f-phone").value.trim();
    var msg = document.getElementById("msg");
    if(!name || !phone){ msg.className="msg err"; msg.textContent="请填写称呼和联系电话"; return; }
    if(!BOOKING_ENDPOINT){ msg.className="msg err"; msg.textContent="预约通道尚未配置（需部署云函数后填入端点）"; return; }
    btn.disabled = true; msg.className="msg"; msg.textContent="提交中…";
    var payload = {
      name:name, phone:phone,
      date:document.getElementById("f-date").value,
      service:document.getElementById("f-service").value,
      budget:document.getElementById("f-budget").value,
      note:document.getElementById("f-note").value
    };
    fetch(BOOKING_ENDPOINT, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    }).then(function(r){return r.json();}).then(function(res){
      btn.disabled = false;
      if(res && res.ok){ msg.className="msg ok"; msg.textContent = (res.message||"提交成功！")+"（预约编号 "+res.id+"）";
        document.getElementById("f-name").value="";document.getElementById("f-phone").value="";
        document.getElementById("f-note").value="";document.getElementById("f-budget").value="";
      } else { msg.className="msg err"; msg.textContent = (res&&res.message)||"提交失败，请稍后重试"; }
    }).catch(function(e){
      btn.disabled = false; msg.className="msg err"; msg.textContent="网络错误，请稍后重试";
    });
  });
})();
</script>
</body>
</html>
